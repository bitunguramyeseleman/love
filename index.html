<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love · Magical Open</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #1e1a2b 0%, #322b3f 100%);
      padding: 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* floating hearts background — INCREASED COUNT & VARIETY */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .floating-hearts span {
      position: absolute;
      bottom: -100px;
      color: #f4aab9;
      font-size: 28px;
      user-select: none;
      animation: rise 16s linear infinite;
      text-shadow: 0 0 25px rgba(255, 60, 100, 0.7);
      opacity: 0.25;
    }
    /* 20 hearts with varied positions, sizes, delays */
    .floating-hearts span:nth-child(1) { left: 2%; animation-delay: 0.0s; font-size: 32px; opacity: 0.35; }
    .floating-hearts span:nth-child(2) { left: 7%; animation-delay: 1.8s; font-size: 26px; opacity: 0.3; }
    .floating-hearts span:nth-child(3) { left: 12%; animation-delay: 3.6s; font-size: 40px; opacity: 0.4; }
    .floating-hearts span:nth-child(4) { left: 18%; animation-delay: 5.2s; font-size: 22px; opacity: 0.25; }
    .floating-hearts span:nth-child(5) { left: 24%; animation-delay: 0.9s; font-size: 36px; opacity: 0.35; }
    .floating-hearts span:nth-child(6) { left: 30%; animation-delay: 7.4s; font-size: 30px; opacity: 0.3; }
    .floating-hearts span:nth-child(7) { left: 36%; animation-delay: 4.1s; font-size: 44px; opacity: 0.45; }
    .floating-hearts span:nth-child(8) { left: 42%; animation-delay: 2.3s; font-size: 24px; opacity: 0.28; }
    .floating-hearts span:nth-child(9) { left: 48%; animation-delay: 6.7s; font-size: 38px; opacity: 0.4; }
    .floating-hearts span:nth-child(10) { left: 54%; animation-delay: 1.2s; font-size: 28px; opacity: 0.32; }
    .floating-hearts span:nth-child(11) { left: 60%; animation-delay: 8.5s; font-size: 34px; opacity: 0.38; }
    .floating-hearts span:nth-child(12) { left: 66%; animation-delay: 3.9s; font-size: 20px; opacity: 0.22; }
    .floating-hearts span:nth-child(13) { left: 72%; animation-delay: 5.8s; font-size: 42px; opacity: 0.42; }
    .floating-hearts span:nth-child(14) { left: 78%; animation-delay: 0.4s; font-size: 26px; opacity: 0.3; }
    .floating-hearts span:nth-child(15) { left: 84%; animation-delay: 6.1s; font-size: 36px; opacity: 0.35; }
    .floating-hearts span:nth-child(16) { left: 90%; animation-delay: 2.9s; font-size: 30px; opacity: 0.3; }
    .floating-hearts span:nth-child(17) { left: 95%; animation-delay: 4.7s; font-size: 46px; opacity: 0.5; }
    .floating-hearts span:nth-child(18) { left: 14%; animation-delay: 9.2s; font-size: 24px; opacity: 0.28; }
    .floating-hearts span:nth-child(19) { left: 45%; animation-delay: 7.8s; font-size: 48px; opacity: 0.45; }
    .floating-hearts span:nth-child(20) { left: 75%; animation-delay: 3.2s; font-size: 32px; opacity: 0.35; }

    @keyframes rise {
      0% { transform: translateY(0) scale(0.3) rotate(0deg); opacity: 0.15; }
      15% { opacity: 0.9; }
      75% { opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.6) rotate(30deg); opacity: 0; }
    }

    /* main container */
    .love-container {
      position: relative;
      width: 560px;
      max-width: 96vw;
      height: 460px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* ENVELOPE — premium design */
    .envelope {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 290px;
      background: linear-gradient(145deg, #b84a5e, #8f3347);
      border-radius: 32px 32px 20px 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 8px 24px rgba(150, 30, 60, 0.5);
      cursor: pointer;
      transition: box-shadow 0.4s ease, transform 0.2s;
      z-index: 20;
      border: 2px solid #e07b8a;
      border-top: 3px solid #f5a0ae;
      transform: perspective(1200px) rotateX(0deg);
    }
    .envelope:hover {
      box-shadow: 0 30px 65px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 70, 110, 0.5);
      transform: perspective(1200px) rotateX(2deg) scale(1.01);
    }

    /* flap */
    .flap {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 0;
      border-left: 280px solid transparent;
      border-right: 280px solid transparent;
      border-top: 160px solid #e86f84;
      border-top-color: #e86f84;
      filter: drop-shadow(0 -6px 12px rgba(0,0,0,0.2));
      transform-origin: top center;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 25;
      pointer-events: none;
      border-radius: 0;
    }
    .flap::after {
      content: '';
      position: absolute;
      top: -160px;
      left: -280px;
      width: 560px;
      height: 160px;
      background: linear-gradient(180deg, #ffb6c8 0%, #d45a72 100%);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      opacity: 0.3;
      pointer-events: none;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
    }

    .envelope-text {
      position: absolute;
      bottom: 34px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff5ee;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      text-shadow: 0 4px 16px rgba(80, 10, 30, 0.6);
      z-index: 15;
      pointer-events: none;
      font-family: 'Georgia', serif;
      opacity: 0.95;
    }
    .envelope-text span {
      display: inline-block;
      background: rgba(150, 40, 65, 0.35);
      backdrop-filter: blur(4px);
      padding: 10px 36px;
      border-radius: 80px;
      border: 1px solid rgba(255, 190, 190, 0.4);
      font-size: 23px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      letter-spacing: 2px;
    }

    /* wax seal */
    .seal {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at 30% 30%, #c92f45, #7a1a2a);
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 -4px 8px rgba(0,0,0,0.4), inset 0 4px 12px rgba(255,180,160,0.3);
      z-index: 30;
      border: 2px solid #e0576e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #ffddc0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      pointer-events: none;
    }
    .seal::after {
      content: '❤️';
      font-size: 32px;
      line-height: 1;
      margin-top: 6px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* LETTER (paper) */
    .letter-paper {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%) translateY(180px) scale(0.92);
      width: 88%;
      max-height: 350px;
      background: #fcf6ef;
      background-image: radial-gradient(circle at 30% 40%, #fff8f0 0%, #f3e3d7 100%);
      border-radius: 22px 22px 16px 16px;
      padding: 32px 28px 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 220, 200, 0.8);
      overflow-y: auto;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 35;
      pointer-events: none;
      border: 1px solid #e6cfbe;
      scrollbar-width: thin;
      scrollbar-color: #c9a692 #f2dfd2;
    }
    .letter-paper::-webkit-scrollbar { width: 6px; }
    .letter-paper::-webkit-scrollbar-thumb { background: #c9a692; border-radius: 20px; }
    .letter-paper::-webkit-scrollbar-track { background: #f2dfd2; border-radius: 20px; }

    .letter-paper h2 {
      color: #9e3f4b;
      font-family: 'Georgia', serif;
      text-align: center;
      font-size: 28px;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
      font-weight: 700;
      border-bottom: 2px dashed #e6cbbc;
      padding-bottom: 5px;
    }
    .letter-paper p {
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 2;
      color: #3d2a24;
      font-size: 18px;
      white-space: pre-line;
      text-shadow: 0 1px 0 rgba(255,255,240,0.7);
      margin: 10px 0;
    }
    .letter-paper .signature {
      text-align: right;
      font-style: italic;
      margin-top: 10px;
      font-size: 20px;
      color: #7a4040;
      font-weight: 500;
    }
    .letter-paper .decor-line {
      text-align: center;
      font-size: 24px;
      margin-top: 3px;
      letter-spacing: 6px;
      color: #b16d6d;
    }

    /* OPEN state */
    .love-container.open .flap {
      transform: rotateX(180deg);
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .love-container.open .letter-paper {
      opacity: 1;
      transform: translateX(-50%) translateY(-18px) scale(1);
      pointer-events: auto;
      transition-delay: 0.35s;
    }
    .love-container.open .seal {
      opacity: 0.25;
      transform: translateX(-50%) scale(0.6);
    }
    .love-container.open .envelope-text {
      opacity: 0.15;
      transition: opacity 0.5s;
    }

    /* BUTTONS */
    .action-buttons {
      margin-top: 320px;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 50;
      position: relative;
      pointer-events: auto;
    }
    .action-buttons button {
      background: rgba(255, 230, 220, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 190, 190, 0.5);
      padding: 14px 34px;
      border-radius: 60px;
      font-size: 19px;
      font-weight: 600;
      color: #ffded6;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: all 0.25s ease;
      letter-spacing: 0.8px;
      background: rgba(160, 60, 80, 0.3);
      border-color: #f5b0b8;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
      pointer-events: auto;
      font-family: 'Segoe UI', sans-serif;
    }
    .action-buttons button:hover {
      transform: scale(1.06);
      background: rgba(210, 80, 110, 0.6);
      box-shadow: 0 10px 32px rgba(200, 50, 80, 0.6);
      border-color: #ffd4d8;
      color: #fff8f5;
    }
    .action-buttons button:active {
      transform: scale(0.94);
    }

    /* ===== MAGICAL BURST EFFECTS ===== */
    .burst-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .burst-item {
      position: absolute;
      font-size: 40px;
      animation: burstFly 1.6s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 30px rgba(255, 100, 150, 0.7);
      opacity: 0;
    }
    @keyframes burstFly {
      0% { 
        transform: translate(0, 0) scale(0.2) rotate(0deg); 
        opacity: 0; 
      }
      15% { 
        opacity: 1; 
        transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(20deg); 
      }
      70% { 
        opacity: 1; 
      }
      100% { 
        transform: translate(calc(var(--tx) * 1.6), calc(var(--ty) * 1.6)) scale(0.6) rotate(50deg); 
        opacity: 0; 
      }
    }

    /* sparkle ring */
    .sparkle-ring {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      animation: ringPulse 0.9s ease-out forwards;
      box-shadow: 0 0 40px 20px rgba(255, 200, 220, 0.6);
      background: radial-gradient(circle, #fff5e6, #ff8a9e);
      transform: translate(-50%, -50%) scale(0);
    }
    @keyframes ringPulse {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0.9; }
      50% { transform: translate(-50%, -50%) scale(12); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(18); opacity: 0; }
    }

    /* responsive */
    @media (max-width: 600px) {
      .love-container { width: 98vw; height: 420px; }
      .envelope { height: 250px; border-radius: 24px; }
      .flap { border-left-width: 220px; border-right-width: 220px; border-top-width: 130px; }
      .flap::after { left: -220px; width: 440px; top: -130px; height: 130px; }
      .letter-paper { width: 90%; padding: 20px 14px; }
      .letter-paper h2 { font-size: 20px; }
      .letter-paper p { font-size: 14px; line-height: 1.8; }
      .letter-paper .signature { font-size: 16px; }
      .letter-paper .decor-line { font-size: 18px; }
      .seal { width: 54px; height: 54px; top: 80px; }
      .seal::after { font-size: 26px; }
      .envelope-text span { font-size: 19px; padding: 6px 20px; }
      .action-buttons { margin-top: 290px; gap: 14px; }
      .action-buttons button { padding: 10px 22px; font-size: 17px; }
    }
    @media (max-width: 420px) {
      .flap { border-left-width: 170px; border-right-width: 170px; border-top-width: 105px; }
      .flap::after { left: -170px; width: 340px; top: -105px; height: 105px; }
      .envelope { height: 220px; }
      .letter-paper { padding: 16px 12px; }
      .letter-paper h2 { font-size: 17px; }
      .letter-paper p { font-size: 12px; line-height: 1.7; }
      .letter-paper .signature { font-size: 14px; }
      .letter-paper .decor-line { font-size: 16px; }
      .seal { width: 44px; height: 44px; top: 68px; }
      .seal::after { font-size: 22px; }
      .action-buttons { margin-top: 260px; }
      .action-buttons button { padding: 8px 16px; font-size: 14px; }
      .envelope-text span { font-size: 16px; padding: 4px 14px; }
    }
  </style>
</head>
<body>
  <!-- floating hearts — INCREASED to 20 with variety -->
  <div class="floating-hearts">
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
  </div>

  <!-- burst container for magical effects -->
  <div class="burst-container" id="burstContainer"></div>

  <div class="love-container" id="loveContainer">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="seal"></div>
      <div class="envelope-text"><span>💌  open  💌</span></div>
    </div>

    <div class="letter-paper" id="letterPaper">
      <h2>❤️ Henriette ❤️</h2>
      <p>
        My love, 
        every day with you feels like a beautiful dream. 
        You are my sunshine, my calm, and my greatest joy, always love you.
        <span class="signature">Forever ❤️ In my heart</span>
      </p>
      <div class="decor-line">✨ 💖 ✨</div>
    </div>

    <div class="action-buttons">
      <button id="openBtn">💕 Open</button>
      <button id="closeBtn">📩 Close</button>
    </div>
  </div>

  <script>
    (function() {
      const container = document.getElementById('loveContainer');
      const envelope = document.getElementById('envelope');
      const letter = document.getElementById('letterPaper');
      const openBtn = document.getElementById('openBtn');
      const closeBtn = document.getElementById('closeBtn');
      const burstContainer = document.getElementById('burstContainer');

      // ─── BURST EFFECTS ──────────────────────────────────────
      const emojis = ['❤️', '💖', '✨', 'Seleman', '💕', '💗', 'Henriette', '🌺', 'Seleman', 'Love u', 'Love u', '💝', 'Love u', '🥰', '💞', '♥️', '✨', 'Henriette'];

      function createBurst(x, y) {
        // ring pulse at center
        const ring = document.createElement('div');
        ring.className = 'sparkle-ring';
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 1000);

        const count = 40 + Math.floor(Math.random() * 25);
        const fragments = [];

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'burst-item';
          const emoji = emojis[Math.floor(Math.random() * emojis.length)];
          el.textContent = emoji;
          
          // random direction and distance
          const angle = Math.random() * 2 * Math.PI;
          const distance = 120 + Math.random() * 280;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance - 80; // bias upward
          
          el.style.setProperty('--tx', tx + 'px');
          el.style.setProperty('--ty', ty + 'px');
          
          // random size
          const size = 28 + Math.random() * 48;
          el.style.fontSize = size + 'px';
          
          // random rotation
          el.style.setProperty('--rot', (Math.random() * 360) + 'deg');
          
          // random delay for organic feel
          el.style.animationDelay = (Math.random() * 0.25) + 's';
          
          // position at click (or center)
          const cx = x || window.innerWidth / 2;
          const cy = y || window.innerHeight / 2;
          el.style.left = (cx - 20) + 'px';
          el.style.top = (cy - 20) + 'px';
          
          burstContainer.appendChild(el);
          fragments.push(el);
        }

        // clean up after animation
        setTimeout(() => {
          fragments.forEach(el => el.remove());
        }, 2000);
      }

      // ─── TRIGGER BURST FROM ENVELOPE AREA ──────────────────
      function triggerMagicalOpen() {
        // get envelope center
        const rect = envelope.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2 - 20;
        createBurst(cx, cy);

        // extra burst from top corners
        setTimeout(() => {
          const cx2 = rect.left + rect.width * 0.2;
          const cy2 = rect.top + rect.height * 0.3;
          createBurst(cx2, cy2);
        }, 150);
        setTimeout(() => {
          const cx3 = rect.left + rect.width * 0.8;
          const cy3 = rect.top + rect.height * 0.3;
          createBurst(cx3, cy3);
        }, 300);
      }

      // ─── OPEN / CLOSE LOGIC ────────────────────────────────
      function toggleLetter() {
        container.classList.toggle('open');
      }

      function openLetter() {
        if (!container.classList.contains('open')) {
          container.classList.add('open');
          triggerMagicalOpen();
        }
      }

      function closeLetter() {
        container.classList.remove('open');
      }

      // envelope click toggles (with burst on open)
      envelope.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!container.classList.contains('open')) {
          openLetter();
        } else {
          closeLetter();
        }
      });

      // prevent letter click from bubbling
      letter.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      // button controls
      openBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        openLetter();
      });

      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeLetter();
      });

      console.log('💖 Love letter with 20 floating hearts and magical bursts!');
    })();
  </script>
</body>
</html>
