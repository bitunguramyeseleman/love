<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter · Envelope & Motion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #1e1a2b 0%, #322b3f 100%);
      padding: 20px;
      margin: 0;
      position: relative;
    }

    /* floating hearts background — more refined */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .floating-hearts span {
      position: absolute;
      bottom: -80px;
      color: #f4aab9;
      font-size: 30px;
      user-select: none;
      animation: rise 14s linear infinite;
      text-shadow: 0 0 20px rgba(255, 60, 100, 0.6);
      opacity: 0.3;
    }
    .floating-hearts span:nth-child(1) { left: 5%; animation-delay: 0s; font-size: 34px; }
    .floating-hearts span:nth-child(2) { left: 16%; animation-delay: 2.8s; font-size: 26px; }
    .floating-hearts span:nth-child(3) { left: 28%; animation-delay: 5.2s; font-size: 38px; }
    .floating-hearts span:nth-child(4) { left: 42%; animation-delay: 1.4s; font-size: 30px; }
    .floating-hearts span:nth-child(5) { left: 56%; animation-delay: 6.8s; font-size: 32px; }
    .floating-hearts span:nth-child(6) { left: 70%; animation-delay: 3.6s; font-size: 28px; }
    .floating-hearts span:nth-child(7) { left: 84%; animation-delay: 8.2s; font-size: 36px; }
    .floating-hearts span:nth-child(8) { left: 94%; animation-delay: 4.8s; font-size: 24px; }

    @keyframes rise {
      0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0.2; }
      20% { opacity: 0.9; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-120vh) scale(1.8) rotate(25deg); opacity: 0; }
    }

    /* main container — refined */
    .love-container {
      position: relative;
      width: 560px;
      max-width: 96vw;
      height: 460px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* ENVELOPE — premium design */
    .envelope {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 290px;
      background: linear-gradient(145deg, #b84a5e, #8f3347);
      border-radius: 32px 32px 20px 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 8px 24px rgba(150, 30, 60, 0.5);
      cursor: pointer;
      transition: box-shadow 0.4s ease, transform 0.2s;
      z-index: 20;
      border: 2px solid #e07b8a;
      border-top: 3px solid #f5a0ae;
      transform: perspective(1200px) rotateX(0deg);
    }
    .envelope:hover {
      box-shadow: 0 30px 65px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 70, 110, 0.5);
      transform: perspective(1200px) rotateX(2deg) scale(1.01);
    }

    /* flap – elegant fold with gradient */
    .flap {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 0;
      border-left: 280px solid transparent;
      border-right: 280px solid transparent;
      border-top: 160px solid #e86f84;
      border-top-color: #e86f84;
      filter: drop-shadow(0 -6px 12px rgba(0,0,0,0.2));
      transform-origin: top center;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 25;
      pointer-events: none;
      border-radius: 0;
    }
    .flap::after {
      content: '';
      position: absolute;
      top: -160px;
      left: -280px;
      width: 560px;
      height: 160px;
      background: linear-gradient(180deg, #ffb6c8 0%, #d45a72 100%);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      opacity: 0.3;
      pointer-events: none;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
    }

    /* envelope text – refined */
    .envelope-text {
      position: absolute;
      bottom: 34px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff5ee;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 2px;
      text-shadow: 0 4px 16px rgba(80, 10, 30, 0.6);
      z-index: 15;
      pointer-events: none;
      font-family: 'Georgia', serif;
      opacity: 0.95;
    }
    .envelope-text span {
      display: inline-block;
      background: rgba(150, 40, 65, 0.35);
      backdrop-filter: blur(4px);
      padding: 10px 36px;
      border-radius: 80px;
      border: 1px solid rgba(255, 190, 190, 0.4);
      font-size: 23px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      letter-spacing: 2px;
    }

    /* wax seal – more detailed */
    .seal {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at 30% 30%, #c92f45, #7a1a2a);
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 -4px 8px rgba(0,0,0,0.4), inset 0 4px 12px rgba(255,180,160,0.3);
      z-index: 30;
      border: 2px solid #e0576e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #ffddc0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      pointer-events: none;
    }
    .seal::after {
      content: '❤️';
      font-size: 32px;
      line-height: 1;
      margin-top: 6px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* LETTER (paper) – premium texture */
    .letter-paper {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%) translateY(180px) scale(0.92);
      width: 88%;
      max-height: 350px;
      background: #fcf6ef;
      background-image: radial-gradient(circle at 30% 40%, #fff8f0 0%, #f3e3d7 100%);
      border-radius: 22px 22px 16px 16px;
      padding: 32px 28px 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255, 220, 200, 0.8);
      overflow-y: auto;
      opacity: 0;
      transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 35;
      pointer-events: none;
      border: 1px solid #e6cfbe;
      scrollbar-width: thin;
      scrollbar-color: #c9a692 #f2dfd2;
    }
    .letter-paper::-webkit-scrollbar {
      width: 6px;
    }
    .letter-paper::-webkit-scrollbar-thumb {
      background: #c9a692;
      border-radius: 20px;
    }
    .letter-paper::-webkit-scrollbar-track {
      background: #f2dfd2;
      border-radius: 20px;
    }

    .letter-paper h2 {
      color: #9e3f4b;
      font-family: 'Georgia', serif;
      text-align: center;
      font-size: 28px;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
      font-weight: 700;
      border-bottom: 2px dashed #e6cbbc;
      padding-bottom: 10px;
    }
    .letter-paper p {
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 2;
      color: #3d2a24;
      font-size: 18px;
      white-space: pre-line;
      text-shadow: 0 1px 0 rgba(255,255,240,0.7);
      margin: 10px 0;
    }
    .letter-paper .signature {
      text-align: right;
      font-style: italic;
      margin-top: 14px;
      font-size: 20px;
      color: #7a4040;
      font-weight: 500;
    }
    .letter-paper .decor-line {
      text-align: center;
      font-size: 24px;
      margin-top: 8px;
      letter-spacing: 6px;
      color: #b16d6d;
    }

    /* OPEN state – smooth */
    .love-container.open .flap {
      transform: rotateX(180deg);
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .love-container.open .letter-paper {
      opacity: 1;
      transform: translateX(-50%) translateY(-18px) scale(1);
      pointer-events: auto;
      transition-delay: 0.35s;
    }
    .love-container.open .seal {
      opacity: 0.25;
      transform: translateX(-50%) scale(0.6);
    }
    .love-container.open .envelope-text {
      opacity: 0.15;
      transition: opacity 0.5s;
    }

    /* BUTTONS — premium glassmorphism */
    .action-buttons {
      margin-top: 320px;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 50;
      position: relative;
      pointer-events: auto;
    }
    .action-buttons button {
      background: rgba(255, 230, 220, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 190, 190, 0.5);
      padding: 14px 34px;
      border-radius: 60px;
      font-size: 19px;
      font-weight: 600;
      color: #ffded6;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: all 0.25s ease;
      letter-spacing: 0.8px;
      background: rgba(160, 60, 80, 0.3);
      border-color: #f5b0b8;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
      pointer-events: auto;
      font-family: 'Segoe UI', sans-serif;
    }
    .action-buttons button:hover {
      transform: scale(1.06);
      background: rgba(210, 80, 110, 0.6);
      box-shadow: 0 10px 32px rgba(200, 50, 80, 0.6);
      border-color: #ffd4d8;
      color: #fff8f5;
    }
    .action-buttons button:active {
      transform: scale(0.94);
    }

    /* responsive */
    @media (max-width: 600px) {
      .love-container { width: 98vw; height: 420px; }
      .envelope { height: 250px; border-radius: 24px; }
      .flap { border-left-width: 220px; border-right-width: 220px; border-top-width: 130px; }
      .flap::after { left: -220px; width: 440px; top: -130px; height: 130px; }
      .letter-paper { width: 90%; padding: 24px 18px; }
      .letter-paper h2 { font-size: 24px; }
      .letter-paper p { font-size: 16px; }
      .seal { width: 54px; height: 54px; top: 80px; }
      .seal::after { font-size: 26px; }
      .envelope-text span { font-size: 19px; padding: 6px 20px; }
      .action-buttons { margin-top: 290px; gap: 14px; }
      .action-buttons button { padding: 10px 22px; font-size: 17px; }
    }
    @media (max-width: 420px) {
      .flap { border-left-width: 170px; border-right-width: 170px; border-top-width: 105px; }
      .flap::after { left: -170px; width: 340px; top: -105px; height: 105px; }
      .envelope { height: 220px; }
      .seal { width: 44px; height: 44px; top: 68px; }
      .seal::after { font-size: 22px; }
      .action-buttons { margin-top: 260px; }
    }
  </style>
</head>
<body>
  <!-- floating hearts -->
  <div class="floating-hearts">
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
  </div>

  <div class="love-container" id="loveContainer">
    <!-- ENVELOPE --><p style="color: white;">Developer love BTSE</p>
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="seal"></div>
      <div class="envelope-text"><span>💌  open  💌</span></div>
    </div>

    <!-- LETTER -->
    <div class="letter-paper" id="letterPaper">
      <h2>❤️ Henriette ❤️</h2>
      <p>
        My love, 
        every day with you feels like a beautiful dream. 
        You are my sunshine, my calm, and my greatest joy, always love you, from Seleman BTSE.
        <span class="signature">Forever ❤️ In my heart</span>
      </p>
      <div class="decor-line">✨ 💖 ✨</div>
    </div>

    <!-- buttons -->
    <div class="action-buttons">
      <button id="openBtn">💕 Open</button>
      <button id="closeBtn">📩 Close</button>
    </div>
  </div>

  <script>
    (function() {
      const container = document.getElementById('loveContainer');
      const envelope = document.getElementById('envelope');
      const letter = document.getElementById('letterPaper');
      const openBtn = document.getElementById('openBtn');
      const closeBtn = document.getElementById('closeBtn');

      // toggle on envelope click
      function toggleLetter() {
        container.classList.toggle('open');
      }

      function openLetter() {
        container.classList.add('open');
      }

      function closeLetter() {
        container.classList.remove('open');
      }

      // envelope click toggles
      envelope.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleLetter();
      });

      // prevent letter click from bubbling
      letter.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      // button controls
      openBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        openLetter();
      });

      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        closeLetter();
      });

      // close if click outside (optional) – but we keep it user-friendly
      document.addEventListener('click', function(e) {
        // if click is outside container and not on buttons, do nothing (let user control)
        // we don't force close to respect user choice.
      });
    })();
  </script>
</body>
</html>
