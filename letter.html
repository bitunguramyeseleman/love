<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter · Envelope & Motion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #2b1a1e 0%, #4a2c33 100%);
      padding: 20px;
      margin: 0;
      position: relative;
    }

    /* floating hearts background */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .floating-hearts span {
      position: absolute;
      bottom: -80px;
      color: #ffb3c6;
      font-size: 28px;
      user-select: none;
      animation: rise 12s linear infinite;
      text-shadow: 0 0 12px rgba(255, 30, 70, 0.5);
    }
    .floating-hearts span:nth-child(1) { left: 6%; animation-delay: 0s; font-size: 32px; }
    .floating-hearts span:nth-child(2) { left: 18%; animation-delay: 2.4s; font-size: 24px; }
    .floating-hearts span:nth-child(3) { left: 30%; animation-delay: 4.8s; font-size: 36px; }
    .floating-hearts span:nth-child(4) { left: 44%; animation-delay: 1.6s; font-size: 28px; }
    .floating-hearts span:nth-child(5) { left: 58%; animation-delay: 6.2s; font-size: 30px; }
    .floating-hearts span:nth-child(6) { left: 72%; animation-delay: 3.8s; font-size: 26px; }
    .floating-hearts span:nth-child(7) { left: 86%; animation-delay: 7.5s; font-size: 34px; }
    .floating-hearts span:nth-child(8) { left: 94%; animation-delay: 5.2s; font-size: 22px; }

    @keyframes rise {
      0% { transform: translateY(0) scale(0.3) rotate(0deg); opacity: 0.2; }
      15% { opacity: 1; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-120vh) scale(1.6) rotate(20deg); opacity: 0; }
    }

    /* main container */
    .love-container {
      position: relative;
      width: 520px;
      max-width: 94vw;
      height: 440px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* ENVELOPE — large, elegant */
    .envelope {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 280px;
      background: #d94f6f;
      background: linear-gradient(145deg, #e35f7a, #c73e5e);
      border-radius: 28px 28px 18px 18px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 8px 20px rgba(190, 40, 70, 0.4);
      cursor: pointer;
      transition: box-shadow 0.3s;
      z-index: 20;
      border: 2px solid #ff8da1;
      border-top: 3px solid #ffafc0;
    }
    .envelope:hover {
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 80, 120, 0.3);
    }

    /* flap – large, with elegant fold */
    .flap {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 0;
      border-left: 260px solid transparent;
      border-right: 260px solid transparent;
      border-top: 150px solid #f57b94;
      border-top-color: #f57b94;
      filter: drop-shadow(0 -4px 8px rgba(0,0,0,0.1));
      transform-origin: top center;
      transition: transform 1s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 25;
      pointer-events: none;
      border-radius: 0;
    }
    /* inner flap shadow effect */
    .flap::after {
      content: '';
      position: absolute;
      top: -150px;
      left: -260px;
      width: 520px;
      height: 150px;
      background: linear-gradient(180deg, #ffb0c0 0%, #e05f7a 100%);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      opacity: 0.4;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
      pointer-events: none;
    }

    /* envelope body text (on the front) */
    .envelope-text {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff1e6;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-shadow: 0 3px 12px rgba(100, 10, 30, 0.5);
      z-index: 15;
      pointer-events: none;
      font-family: 'Georgia', serif;
      opacity: 0.9;
      mix-blend-mode: soft-light;
    }
    .envelope-text span {
      display: inline-block;
      background: rgba(180, 40, 70, 0.3);
      backdrop-filter: blur(2px);
      padding: 8px 28px;
      border-radius: 60px;
      border: 1px solid rgba(255, 200, 200, 0.3);
      font-size: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* wax seal (decorative) */
    .seal {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 35%, #b3223a, #6f1524);
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.3);
      z-index: 30;
      border: 2px solid #c9475e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #ffcfb0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      transition: all 0.3s;
      pointer-events: none;
    }
    .seal::after {
      content: '❤️';
      font-size: 28px;
      line-height: 1;
      margin-top: 4px;
    }

    /* LETTER (paper) – appears inside envelope */
    .letter-paper {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(160px) scale(0.9);
      width: 88%;
      max-height: 340px;
      background: #fefaf2;
      background-image: radial-gradient(circle at 20% 30%, #fff6ec 0%, #f5e6da 100%);
      border-radius: 18px 18px 12px 12px;
      padding: 28px 24px 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255, 220, 200, 0.7);
      overflow-y: auto;
      opacity: 0;
      transition: all 1.1s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 35;
      pointer-events: none;
      border: 1px solid #edd6c4;
      scrollbar-width: thin;
      scrollbar-color: #d9a693 #f5e0d4;
    }
    .letter-paper::-webkit-scrollbar {
      width: 5px;
    }
    .letter-paper::-webkit-scrollbar-thumb {
      background: #d9a693;
      border-radius: 20px;
    }
    .letter-paper::-webkit-scrollbar-track {
      background: #f5e0d4;
      border-radius: 20px;
    }

    .letter-paper h2 {
      color: #a63a4a;
      font-family: 'Georgia', serif;
      text-align: center;
      font-size: 26px;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 700;
      border-bottom: 2px dashed #ecc7b8;
      padding-bottom: 8px;
    }
    .letter-paper p {
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 1.9;
      color: #3d2823;
      font-size: 17px;
      white-space: pre-line;
      text-shadow: 0 1px 0 rgba(255,255,240,0.8);
      margin: 8px 0;
    }
    .letter-paper .signature {
      text-align: right;
      font-style: italic;
      margin-top: 10px;
      font-size: 18px;
      color: #864b4b;
    }

    /* OPEN state */
    .love-container.open .flap {
      transform: rotateX(180deg);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .love-container.open .letter-paper {
      opacity: 1;
      transform: translateX(-50%) translateY(-20px) scale(1);
      pointer-events: auto;
      transition-delay: 0.3s;
    }
    .love-container.open .seal {
      opacity: 0.3;
      transform: translateX(-50%) scale(0.6);
    }
    .love-container.open .envelope-text {
      opacity: 0.2;
      transition: opacity 0.3s;
    }

    /* BUTTONS — elegant */
    .action-buttons {
      margin-top: 300px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 50;
      position: relative;
      pointer-events: auto;
    }
    .action-buttons button {
      background: rgba(255, 230, 220, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 180, 180, 0.5);
      padding: 12px 30px;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 600;
      color: #ffdcd2;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      transition: all 0.25s;
      letter-spacing: 0.5px;
      background: rgba(180, 60, 80, 0.4);
      border-color: #ffafb0;
      text-shadow: 0 1px 6px rgba(0,0,0,0.3);
      pointer-events: auto;
    }
    .action-buttons button:hover {
      transform: scale(1.05);
      background: rgba(220, 80, 110, 0.7);
      box-shadow: 0 8px 28px rgba(200, 50, 80, 0.5);
      border-color: #ffcdd0;
      color: #fff5f0;
    }
    .action-buttons button:active {
      transform: scale(0.94);
    }

    /* responsive */
    @media (max-width: 540px) {
      .love-container { width: 96vw; height: 400px; }
      .envelope { height: 240px; border-radius: 20px; }
      .flap { border-left-width: 200px; border-right-width: 200px; border-top-width: 120px; }
      .flap::after { left: -200px; width: 400px; top: -120px; height: 120px; }
      .letter-paper { width: 90%; padding: 20px 16px; }
      .letter-paper h2 { font-size: 22px; }
      .letter-paper p { font-size: 15px; }
      .seal { width: 48px; height: 48px; top: 80px; font-size: 24px; }
      .seal::after { font-size: 22px; }
      .envelope-text span { font-size: 18px; padding: 4px 16px; }
      .action-buttons { margin-top: 280px; gap: 12px; }
      .action-buttons button { padding: 10px 18px; font-size: 16px; }
    }
    @media (max-width: 400px) {
      .flap { border-left-width: 160px; border-right-width: 160px; border-top-width: 100px; }
      .flap::after { left: -160px; width: 320px; top: -100px; height: 100px; }
    }
  </style>
</head>
<body>
  <!-- floating hearts -->
  <div class="floating-hearts">
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
  </div>

  <div class="love-container" id="loveContainer">
    <!-- ENVELOPE (large) -->
    <div class="envelope" id="envelope" onclick="toggleLetter()">
      <div class="flap"></div>
      <div class="seal"></div>
      <div class="envelope-text"><span>💌 open me 💌</span></div>
    </div>

    <!-- LETTER (paper inside) -->
    <div class="letter-paper" id="letterPaper">
      <h2>❤️ My Dearest ❤️</h2>
      <p>
        My love, 
        Every day with you feels like a beautiful dream. 
        You are my sunshine, my calm, and my greatest joy.

        I promise to stand by you, cherish you, 
        and fill your life with laughter and warmth.

        With all my heart,
        <span class="signature">Forever yours, ❤️</span>
      </p>
      <p style="text-align:center; font-size:22px; margin-top:6px;">✨ 💖 ✨</p>
    </div>

    <!-- buttons -->
    <div class="action-buttons">
      <button onclick="openLetter()">💕 Open</button>
      <button onclick="closeLetter()">📩 Close</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('loveContainer');
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letterPaper');

    // toggle on envelope click
    function toggleLetter() {
      container.classList.toggle('open');
    }

    function openLetter() {
      container.classList.add('open');
    }

    function closeLetter() {
      container.classList.remove('open');
    }

    // click on envelope triggers toggle
    envelope.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleLetter();
    });

    // prevent letter click from bubbling to envelope
    letter.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    // close if click outside (optional)
    document.addEventListener('click', function(e) {
      if (!container.contains(e.target) && !e.target.closest('.action-buttons')) {
        // do not force close, user can close with button
      }
    });
  </script>
</body>
</html>
